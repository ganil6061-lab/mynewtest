<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .game {
            width: 350px;
            padding: 25px;

            background: white;
            border-radius: 15px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
        }

        #status {
            margin-bottom: 20px;

            font-size: 20px;
            font-weight: bold;
        }

        .board {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 8px;

            margin-bottom: 20px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;

            border: none;
            border-radius: 10px;

            background: #eeeeee;

            font-size: 45px;
            font-weight: bold;

            cursor: pointer;
        }

        .cell:hover {
            background: #dddddd;
        }

        .cell.x {
            color: #2196f3;
        }

        .cell.o {
            color: #e91e63;
        }

        #restart {
            padding: 12px 25px;

            border: none;
            border-radius: 8px;

            background: #2196f3;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        #restart:hover {
            background: #1976d2;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Tic Tac Toe</h1>

        <div id="status">
            Player X's Turn
        </div>

        <div class="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>

        <button id="restart">
            Restart Game
        </button>

    </div>


    <script>

        // सभी 9 cells
        const cells = document.querySelectorAll(".cell");

        // Status text
        const status = document.getElementById("status");

        // Restart button
        const restartButton = document.getElementById("restart");


        // Game board
        // कुल 9 positions
        let board = [
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            ""
        ];


        // पहला player X
        let currentPlayer = "X";


        // Game चालू है
        let gameRunning = true;


        // जीतने के सभी combinations
        const winningPatterns = [

            // Rows
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            // Columns
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            // Diagonal
            [0, 4, 8],
            [2, 4, 6]

        ];


        // हर cell पर click
        cells.forEach(function(cell, index) {

            cell.addEventListener("click", function() {

                // अगर game खत्म हो चुका है
                if (!gameRunning) {
                    return;
                }


                // अगर cell पहले से भरा है
                if (board[index] !== "") {
                    return;
                }


                // Board में X या O डालना
                board[index] = currentPlayer;


                // Screen पर दिखाना
                cell.textContent = currentPlayer;


                // CSS class
                if (currentPlayer === "X") {

                    cell.classList.add("x");

                } else {

                    cell.classList.add("o");

                }


                // Winner check
                checkWinner();

            });

        });


        // Winner check करने वाला function
        function checkWinner() {

            let winner = null;


            // सभी winning patterns check करें
            for (let pattern of winningPatterns) {

                const a = pattern[0];
                const b = pattern[1];
                const c = pattern[2];


                // तीनों positions same हैं?
                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {

                    winner = board[a];

                    break;
                }

            }


            // अगर winner मिल गया
            if (winner !== null) {

                status.textContent =
                    "Player " + winner + " Wins!";

                gameRunning = false;

                return;
            }


            // अगर कोई खाली cell नहीं बचा
            if (!board.includes("")) {

                status.textContent = "Game Draw!";

                gameRunning = false;

                return;
            }


            // Player बदलना
            if (currentPlayer === "X") {

                currentPlayer = "O";

            } else {

                currentPlayer = "X";

            }


            // अगली turn
            status.textContent =
                "Player " + currentPlayer + "'s Turn";

        }


        // Restart button
        restartButton.addEventListener("click", restartGame);


        // Game restart
        function restartGame() {

            // Board को फिर से 9 खाली positions करना
            board = [
                "",
                "",
                "",
                "",
                "",
                "",
                "",
                ""
            ];


            // X से शुरू
            currentPlayer = "X";


            // Game चालू
            gameRunning = true;


            // Status reset
            status.textContent = "Player X's Turn";


            // सभी cells साफ करना
            cells.forEach(function(cell) {

                cell.textContent = "";

                cell.classList.remove("x");
                cell.classList.remove("o");

            });

        }

    </script>

</body>
</html>
