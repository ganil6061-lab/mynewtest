<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 15px;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: #eeeeee;
            border: none;
            border-radius: 10px;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background: #dddddd;
        }

        .cell.x {
            color: #2196f3;
        }

        .cell.o {
            color: #e91e63;
        }

        #restart {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #restart:hover {
            background: #1976d2;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Tic Tac Toe</h1>

        <div id="status">Player X's Turn</div>

        <div class="board">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <button id="restart">Restart Game</button>

    </div>


    <script>

        // सभी cells को select करना
        const cells = document.querySelectorAll(".cell");

        // Status text
        const status = document.getElementById("status");

        // Restart button
        const restartButton = document.getElementById("restart");


        // Game की current स्थिति
        let board = [
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            ""
        ];


        // शुरुआत में X की turn
        let currentPlayer = "X";

        // Game चल रहा है या नहीं
        let gameRunning = true;


        // जीतने के सभी possible combinations
        const winningPatterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        // हर cell पर click event
        cells.forEach((cell, index) => {

            cell.addEventListener("click", function() {

                // अगर game खत्म हो गया या cell पहले से भरा है
                if (!gameRunning || board[index] !== "") {
                    return;
                }

                // Board में player को रखना
                board[index] = currentPlayer;

                // Screen पर X या O दिखाना
                cell.textContent = currentPlayer;

                // CSS class लगाना
                cell.classList.add(currentPlayer.toLowerCase());


                // Winner check करना
                checkWinner();

            });

        });


        function checkWinner() {

            let winner = null;


            // सभी winning patterns check करें
            for (let pattern of winningPatterns) {

                const a = pattern[0];
                const b = pattern[1];
                const c = pattern[2];


                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[a] === board[c]
                ) {

                    winner = board[a];

                    break;
                }
            }


            // अगर winner मिल गया
            if (winner !== null) {

                status.textContent = "Player " + winner + " Wins!";

                gameRunning = false;

                return;
            }


            // अगर सभी cells भर गए
            if (!board.includes("")) {

                status.textContent = "Game Draw!";

                gameRunning = false;

                return;
            }


            // Player बदलना
            currentPlayer = currentPlayer === "X" ? "O" : "X";

            status.textContent =
                "Player " + currentPlayer + "'s Turn";

        }


        // Restart button
        restartButton.addEventListener("click", restartGame);


        function restartGame() {

            // Board खाली करना
            board = [
                "",
                "",
                "",
                "",
                "",
                "",
                "",
                "",
                ""
            ];

            // X से दोबारा शुरू
            currentPlayer = "X";

            // Game चालू
            gameRunning = true;

            // Status reset
            status.textContent = "Player X's Turn";


            // सभी cells खाली करना
            cells.forEach(cell => {

                cell.textContent = "";

                cell.classList.remove("x");
                cell.classList.remove("o");

            });

        }

    </script>

</body>
</html>
